mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: ""
bind-address: "*"
unified-delay: true
external-ui: ./dashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/gh-pages.zip"
global-client-fingerprint: chrome
find-process-mode: off
tcp-concurrent: true  
proxies:
  - name: "WARP+"
    type: http
    server: 127.0.0.1
    port: 8086
            
proxy-providers:
  AC-INDONESIA:
    type: file
    path: "./proxy_provider/ACC_Config_ID.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: '120'
  AC-SINGAPURA:
    type: file
    path: "./proxy_provider/ACC_Config_SG.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: '120'
  AC-MIX-UDP:
    type: file
    path: "./proxy_provider/ACC_Config_UDP.yaml"
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: '120'

# ⫘⫘⫘⫘⫘ ANOTHER CLASH SETTINGS ⫘⫘⫘⫘⫘
sniffer:
  enable: false
  sniff:
    http: { ports: [1-442, 444-8442, 8444-65535], override-destination: true }
    tls: { ports: [1-79, 81-8079, 8081-65535], override-destination: true }
  force-domain:
      - +.v2ex.com
      - www.google.com
      - google.com
  skip-domain:
      - Mijia Cloud
      - dlg.io.mi.com
  sniffing:
    - tls
    - http
  port-whitelist:
    - 80
    - 443

tun:
  enable: false
  mtu: 9000
  device: utun
  stack: system # system / gvisor / system / lwip
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  include-android-user: [0, 10]
  exclude-package: []
  include-package: []
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:1053
  fake-ip-filter:
  - "+.*"
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - https://dns.google/dns-query#UMUM
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  proxy-server-nameserver:
    - 112.215.203.248 #DNS XL
    - 112.215.203.254 #DNS XL
    - 112.215.198.248 #DNS XL
    - 112.215.198.254 #DNS XL
    - '[2400:9800:2:2::245]' #DNS XL
    - '[2400:9800:2:2::246]' #DNS XL
  fallback-filter:
    geoip: true
    geoip-code: ID
    ipcidr:
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.18.0.0/15
    - 198.51.100.0/24
    - 203.0.113.0/24
    - 224.0.0.0/4
    - 240.0.0.0/4
    - 255.255.255.255/32
    domain:
    - "+.google.com"
    - "+.facebook.com"
    - "+.youtube.com"
    - "+.githubusercontent.com"
    - "+.googlevideo.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - msftconnecttest.com
    - msftncsi.com
    - "+.*"
profile:
  store-selected: true
  store-fake-ip: true
            
